<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52B788;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B4332;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Leaf icon -->
  <g transform="translate(8, 10)">
    <!-- Main leaf shape -->
    <path d="M40 70 C40 70 10 50 12 25 C14 5 35 2 40 2 C45 2 66 5 68 25 C70 50 40 70 40 70Z"
          fill="url(#leafGrad)" />
    <!-- Leaf vein -->
    <line x1="40" y1="70" x2="40" y2="8" stroke="#F8F6F0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Side veins -->
    <line x1="40" y1="30" x2="25" y2="22" stroke="#F8F6F0" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="40" y1="40" x2="55" y2="32" stroke="#F8F6F0" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <line x1="40" y1="52" x2="27" y2="46" stroke="#F8F6F0" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <!-- Small sprout -->
    <path d="M40 70 C40 70 34 62 30 58" stroke="#1B4332" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Ground line -->
    <line x1="20" y1="78" x2="60" y2="78" stroke="#D4A853" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Company Name -->
  <text x="92" y="44" font-family="'Georgia', serif" font-size="26" font-weight="700"
        letter-spacing="2" fill="#1B4332">RUDI</text>
  <text x="92" y="72" font-family="'Georgia', serif" font-size="26" font-weight="700"
        letter-spacing="2" fill="#2D6A4F">MACHT ALLES</text>

  <!-- Tagline -->
  <text x="93" y="88" font-family="'Arial', sans-serif" font-size="10" font-weight="400"
        letter-spacing="3.5" fill="#D4A853">GARTENBAU &amp; PFLEGE</text>
</svg>
