<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,700&family=Montserrat:wght@700&display=swap');
      .rudi-text { font-family: 'Lora', serif; font-size: 56px; font-style: italic; font-weight: 700; fill: #1A3D2B; }
      .macht-text { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; fill: #1A3D2B; letter-spacing: 2px; }
      .tagline-text { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; fill: #B8750E; letter-spacing: 2px; }
    </style>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A7D54"/>
      <stop offset="100%" stop-color="#B8750E"/>
    </linearGradient>
  </defs>

  <!-- ICON: Baum mit Pflasterstein-Wurzeln -->
  <g id="icon">
    <!-- Baum-Stamm -->
    <rect x="18" y="42" width="4" height="28" fill="#6B4C35" rx="2"/>

    <!-- Baum-Blätter (3 Schichten) -->
    <!-- Obere Blattschicht -->
    <circle cx="20" cy="28" r="16" fill="url(#treeGrad)" opacity="0.95"/>

    <!-- Mittlere Blattschicht -->
    <circle cx="12" cy="42" r="14" fill="url(#treeGrad)" opacity="0.85"/>
    <circle cx="28" cy="42" r="14" fill="url(#treeGrad)" opacity="0.85"/>

    <!-- Untere Blattschicht -->
    <circle cx="8" cy="54" r="12" fill="url(#treeGrad)" opacity="0.75"/>
    <circle cx="32" cy="54" r="12" fill="url(#treeGrad)" opacity="0.75"/>

    <!-- Wurzeln transformieren zu Pflastersteinen -->
    <!-- Linke Wurzel → Stein -->
    <path d="M 16 70 L 10 82" stroke="#6B4C35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="6" y="82" width="9" height="9" fill="#B8750E" rx="1"/>

    <!-- Mittlere Wurzel → Stein -->
    <path d="M 20 70 L 20 80" stroke="#6B4C35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="16" y="80" width="9" height="9" fill="#B8750E" rx="1"/>

    <!-- Rechte Wurzel → Stein -->
    <path d="M 24 70 L 30 82" stroke="#6B4C35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="30" y="82" width="9" height="9" fill="#B8750E" rx="1"/>

    <!-- Dekorative Linie unter Icon -->
    <line x1="8" y1="98" x2="36" y2="98" stroke="#B8750E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- TEXT: "Rudi" in Lora Italic -->
  <text x="58" y="65" class="rudi-text">Rudi</text>

  <!-- TEXT: "Macht Alles" in Montserrat Bold -->
  <text x="58" y="90" class="macht-text">Macht Alles</text>

  <!-- Trennlinie -->
  <line x1="58" y1="98" x2="260" y2="98" stroke="#B8750E" stroke-width="1.5"/>

  <!-- TAGLINE: "Gartenbau & Mehr" -->
  <text x="58" y="115" class="tagline-text">GARTENBAU • LANDSCHAFT • HANDWERK</text>

</svg>
